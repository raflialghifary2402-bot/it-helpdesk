<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Notifikasi - Helpdesk IT</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

:root{
    --primary:#7b1e32;
    --primary-dark:#5c1524;
}

body{
    background:#f5f7fb;
    font-family:'Segoe UI',sans-serif;
}

.card-box{
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.title{
    color:var(--primary);
    font-weight:700;
}

.notification-item{

    border-left:5px solid var(--primary);

    background:#fafafa;

    padding:18px;

    border-radius:12px;

    margin-bottom:15px;

    transition:.3s;

}

.notification-item:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.notification-read{

    border-left:5px solid #198754;

    background:#f0fff5;

}

.time{
    color:#888;
    font-size:13px;
}

.close-page{

    position:fixed;

    top:20px;
    right:20px;

    width:50px;
    height:50px;

    border-radius:50%;

    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    color:var(--primary);

    font-size:22px;

    box-shadow:0 4px 15px rgba(0,0,0,.15);

    transition:.3s;

    z-index:999;
}

.close-page:hover{
    background:var(--primary);
    color:white;
    transform:rotate(90deg);
}

.empty-box{

    text-align:center;

    padding:60px 20px;

    color:#999;
}

.empty-box i{
    color:#ccc;
}

.badge-status{
    font-size:12px;
    padding:6px 10px;
}

.header-info{
    border-bottom:1px solid #eee;
    padding-bottom:15px;
    margin-bottom:25px;
}

@media(max-width:768px){

    .card-box{
        margin:20px;
        padding:20px;
    }

}

</style>

</head>

<body>

<a href="/dashboard" class="close-page">
    <i class="fa-solid fa-xmark"></i>
</a>

<div class="container">

    <div class="card-box">

        <div class="header-info d-flex justify-content-between align-items-center">

            <h2 class="title mb-0">

                <i class="fa-solid fa-bell me-2"></i>

                Notifikasi

            </h2>

            <span class="badge bg-secondary">

                {{ data|length if data else 0 }} Notifikasi

            </span>

        </div>

        {% if data %}

            {% for n in data %}

            <div class="
            notification-item
            {% if n.dibaca == 1 %}
            notification-read
            {% endif %}
            ">

                <div class="d-flex justify-content-between align-items-center">

                    <strong>

                        <i class="fa-solid fa-circle-info me-2"></i>

                        Update Ticket

                    </strong>

                    {% if n.dibaca == 1 %}

                    <span class="badge bg-success badge-status">
                        Dibaca
                    </span>

                    {% else %}

                    <span class="badge bg-danger badge-status">
                        Baru
                    </span>

                    {% endif %}

                </div>

                <div class="mt-3">

                    {{ n.pesan }}

                </div>

                <div class="time mt-2">

                    <i class="fa-solid fa-hashtag"></i>

                    ID Notifikasi :
                    {{ n.id }}

                </div>

            </div>

            {% endfor %}

        {% else %}

        <div class="empty-box">

            <i class="fa-solid fa-bell-slash fa-5x mb-3"></i>

            <h4>Tidak Ada Notifikasi</h4>

            <p class="mb-0">

                Belum ada pemberitahuan yang masuk.

            </p>

        </div>

        {% endif %}

    </div>

</div>

<script>

/*
Refresh otomatis setiap 30 detik
lebih ringan dibanding 10 detik
*/

setInterval(function(){

    location.reload();

},30000);

</script>

</body>

</html>
